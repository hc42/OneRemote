# XcodeGen configuration: generates OneRemote.xcodeproj from it
# Usage:  brew install xcodegen && xcodegen generate && open OneRemote.xcodeproj
name: OneRemote

options:
  bundleIdPrefix: de.halfbrodt
  # English is the source language and the fallback; German lives in Resources/de.lproj
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"

# The signing team comes from Config/Local.xcconfig (not in git)
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Single source of truth for versions, see docs/adr/0017-versioning-and-releases.md
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OneRemote:
    type: application
    supportedDestinations: [iOS, macOS]
    # Launch screen (iOS): black background with the icon. Nested entries do not work
    # via INFOPLIST_KEY_*, so XcodeGen generates an Info.plist that is merged with the
    # INFOPLIST_KEY_* values.
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
    sources:
      - path: OneRemote
        excludes:
          - "*.entitlements"
    # Test plans (TestPlans/): "Unit" is the default for Cmd+U, "UI" starts the app against a
    # simulated amplifier and takes longer, "All" runs both. Pick one in the scheme's test action.
    scheme:
      testPlans:
        - path: TestPlans/Unit.xctestplan
          defaultPlan: true
        - path: TestPlans/UI.xctestplan
        - path: TestPlans/All.xctestplan
        - path: TestPlans/Screenshots.xctestplan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.halfbrodt.OneRemote
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    configs:
      # The launch arguments of the simulated amplifier (UI tests, screenshots) work in debug builds only;
      # demo mode (SimulatedAmplifier) is in every build
      Debug:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        # Name under the icon (iOS) and in the menu bar/window (macOS)
        INFOPLIST_KEY_CFBundleDisplayName: "One Remote"
        PRODUCT_NAME: "One Remote"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "The app connects to your amplifier via Bluetooth to control volume and input."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPhone and iPad
        TARGETED_DEVICE_FAMILY: "1,2"
        # macOS only: app sandbox with Bluetooth permission
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": OneRemote/OneRemote-macOS.entitlements
        ENABLE_APP_SANDBOX: YES

  # Unit tests of the pure logic. They compile the logic files directly instead of loading the
  # app, so they run without launching it (see docs/adr/0018-testing-strategy.md).
  OneRemoteTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: OneRemoteTests
      - path: OneRemote/BLE/AmpProtocol.swift
      - path: OneRemote/BLE/BLETransport.swift
      - path: OneRemote/BLE/CoreBluetoothTransport.swift
      - path: OneRemote/BLE/AmpController.swift
      - path: OneRemote/Model/AmpParser.swift
      - path: OneRemote/Model/VolumeScale.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.halfbrodt.OneRemoteTests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # XCTest on macOS needs 14 (the app itself stays on 13)
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  # UI tests: start the app with a simulated amplifier (see docs/adr/0018-testing-strategy.md)
  OneRemoteUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: OneRemoteUITests
    dependencies:
      - target: OneRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.halfbrodt.OneRemoteUITests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # XCTest on macOS needs 14 (the app itself stays on 13)
        MACOSX_DEPLOYMENT_TARGET: "14.0"
