name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

jobs:
  analyze:
    name: Analyze (Swift)
    # Swift needs macOS. The Xcode project is generated from project.yml and not committed,
    # so the default autobuild finds nothing; build manually after `xcodegen generate`.
    runs-on: macos-15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project OneRemote.xcodeproj \
            -scheme OneRemote \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
